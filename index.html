<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRUDEL</title>
<meta name="theme-color" content="#FAFBFC">
<meta name="description" content="Track workouts, runs, food, water, sleep and recovery.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BRUDEL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --bg:#FAFBFC;--surface:#FFFFFF;--sunk:#EFF3F4;--ink:#15262B;--muted:#687A80;--line:#E2E9EB;
  --brand:#167A80;--brand-soft:#E0F0F0;--brand-ink:#FFFFFF;
  --p:#E8603C;--p-soft:#FDE9E2;--c:#E5A42E;--c-soft:#FCF1DB;--f:#7E62B3;--f-soft:#EFEAF7;
  --water:#2F8FD8;--water-soft:#E4F0FB;--cardio:#2F8FD8;--rest:#BCC7CA;--warn:#D2462E;
  --shadow:0 1px 2px rgba(21,38,43,.04),0 10px 28px -16px rgba(18,70,76,.28);
  --display:"Bricolage Grotesque","Avenir Next",Avenir,"Segoe UI",sans-serif;
  --body:"DM Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Always white, as requested */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:580px;margin:0 auto;padding:14px 16px 112px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;letter-spacing:-.01em}
h2{font-size:28px}
h3{font-size:21px;margin:30px 0 12px}
h4{margin:0;font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:8px}
.phoenix{width:58px;height:68px;flex:none;margin:-12px -2px -10px -8px}
.wordmark{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.2em;color:var(--ink);line-height:1;display:flex;flex-direction:column;gap:5px}
.wordmark i{display:block;height:4px;width:calc(100% - .2em);border-radius:2px;background:linear-gradient(90deg,#9E0F1C,#E12A22 35%,#F8752A 70%,#FDBE3F)}
.wordmark span{color:#E5261F}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--brand);background:var(--surface);outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{background:linear-gradient(135deg,#1F9399,#12676C);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 18px -10px rgba(18,103,108,.6)}
.btn.soft{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon{background:transparent;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:17px;line-height:1}
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card+.card{margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field{margin-bottom:14px}
.daybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.daybar h2{font-size:26px}
.daybar .icon{font-size:24px;padding:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--brand);box-shadow:var(--shadow)}
.note{background:var(--sunk);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;color:var(--ink)}
.note.warn{background:var(--p-soft)}
.empty{color:var(--muted);padding:4px 0;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--sunk);border:0;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff}
.chip:hover{filter:brightness(.98)}

/* hero */
.hero{background:linear-gradient(150deg,#E4F3F2 0%,#FFF1EA 100%);border-radius:30px;padding:20px;border:1px solid #D7EAE8}
.hero-top{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px}
.ring .big{font-family:var(--display);font-weight:800;font-size:34px;fill:var(--ink)}
.ring .lbl{font-size:12px;fill:var(--muted)}
.hero .kpis p{margin:0 0 4px;font-size:15px}
.hero .kpis b{font-family:var(--display);font-size:20px}
.left3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.left3 div{background:var(--surface);border-radius:16px;padding:12px}
.left3 b{font-family:var(--display);font-size:26px;font-weight:800;display:block;line-height:1}
.left3 small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.left3 .lab{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.track{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.fill{height:100%;border-radius:4px}

/* meals */
.meal{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.meal-h{display:flex;align-items:center;gap:12px}
.meal-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.meal-h .grow{flex:1;min-width:0}
.meal-h .k{font-family:var(--display);font-weight:800;font-size:18px}
.addbtn{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,#1F9399,#12676C);color:#fff;font-size:22px;line-height:1;flex:none;box-shadow:0 6px 14px -6px rgba(18,103,108,.5)}
.items{list-style:none;margin:10px 0 0;padding:0}
.items li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.items .grow{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere;font-size:15px}
.mline{font-size:13px;color:var(--muted)}
.adder{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.actions3 button{background:var(--sunk);border:0;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.actions3 svg{width:22px;height:22px;color:var(--brand)}
.sugg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.sugg p{font-size:14px;color:var(--muted);margin:4px 0 8px}

/* water */
.water{background:linear-gradient(160deg,#EDF5FD 0%,#D8EAF9 100%);border:1px solid #CDE2F4;border-radius:30px;padding:18px;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.water svg.bottle{width:96px;height:auto}
.water .amt{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.glasses{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.glass{width:26px;height:30px;border:0;padding:0;background:transparent}
.glass svg{width:26px;height:30px}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wbtns button{background:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--water);box-shadow:0 4px 12px -6px rgba(47,143,216,.45)}
.water .amt{color:#1D6AA8}

/* lists/tables */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:13px}
td.n{font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 7px;margin-left:6px;font-weight:500}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;margin-bottom:14px}
.seg2 button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ex{margin-bottom:16px}

/* stats & charts */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:var(--sunk);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--body)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 2px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.dayc.today{outline:2px solid var(--brand)}
.dayc .dn{font-size:12px;color:var(--muted);font-weight:600}
.dayc .dd{font-family:var(--display);font-weight:800;font-size:18px}
.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.b-lift{background:var(--brand);color:var(--brand-ink)}
.b-cardio{background:var(--cardio);color:#fff}
.b-both{background:linear-gradient(135deg,var(--brand) 50%,var(--cardio) 50%);color:#fff}
.b-rest{background:var(--sunk);color:var(--muted)}
.b-plan{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.b-miss{background:transparent;border:2px solid var(--p);color:var(--p)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.counts div{border-radius:18px;padding:14px}
.counts b{font-family:var(--display);font-weight:800;font-size:30px;display:block;line-height:1}
.counts span{font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);padding-bottom:4px}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:var(--sunk);gap:2px}
.cal .c.out{background:transparent}
.cal .c i{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* recover */
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.score b{font-family:var(--display);font-size:68px;font-weight:800;line-height:.9}
.musc{display:grid;grid-template-columns:92px 1fr 76px;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.musc .v{font-size:13px;color:var(--muted);text-align:right}

/* plan/onboarding */
.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.targets div{background:var(--sunk);border-radius:20px;padding:14px}
.targets b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1}
.targets span{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--brand)}
.sci h3{margin-top:28px}
.sci p{max-width:68ch}
.ref{font-size:13px;color:var(--muted);margin-top:-4px}
.grade{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;background:var(--sunk);color:var(--muted)}
.grade.a{background:var(--brand-soft);color:var(--brand)}
.results{margin-top:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.results button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 12px}
.results button:last-child{border-bottom:0}
.results small{display:block;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--brand)}
nav.tabs a[aria-current="page"] svg{background:var(--brand-soft);border-radius:10px;padding:3px;width:30px;height:28px;margin:-3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1}
.hide{display:none!important}
.back{display:inline-block;margin:-4px 0 10px;color:var(--brand);text-decoration:none;font-weight:600;font-size:15px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);flex:none}
.av.big{width:72px;height:72px;font-size:30px}
.phead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-top:12px}
.grades div{background:#fff;border-radius:14px;padding:10px 2px}
.grades b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.grades span{font-size:11px;color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{border-radius:16px;padding:12px 8px;text-align:center;background:var(--sunk);font-size:12px;color:var(--muted)}
.ach div.on{background:var(--brand-soft);color:var(--ink)}
.ach .ico{width:26px;height:26px;display:block;margin:0 auto 6px;color:var(--rest)}
.ach div.on .ico{color:var(--brand)}
.ach b{display:block;font-size:13px;margin-bottom:2px}
.links .list li{cursor:pointer}
.links a{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.links a:last-child{border-bottom:0}
.links a .ico{color:var(--brand)}
.links a span.sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.links a .chev{margin-left:auto;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 14px;text-align:center}
.podium div{border-radius:20px 20px 12px 12px;padding:12px 6px}
.podium .av{margin:0 auto 6px}
.podium b{display:block;font-family:var(--display);font-size:22px}
.podium small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank.me{background:var(--brand-soft);margin:0 -10px;padding:11px 10px;border-radius:14px;border-bottom:0}
.rank .pos{width:20px;font-weight:700;color:var(--muted);text-align:center}
.rank .grow{flex:1;min-width:0}
.rank .pts{font-family:var(--display);font-weight:800;font-size:20px}
.five{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--brand)}
.five[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.meal-ic .ico{width:22px;height:22px}
.badge .ico{width:15px;height:15px}
.search{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:999px;padding:4px 16px;margin-bottom:12px;border:1px solid transparent}
.search:focus-within{border-color:var(--brand);background:#fff}
.search input{background:transparent;border:0;padding:10px 0}
.search .ico{color:var(--muted)}
.frow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.frow .grow{flex:1;min-width:0}
.frow .plus{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.fhead{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 4px}
.detail{background:linear-gradient(150deg,#E4F3F2,#FFF1EA);border:1px solid #D7EAE8;border-radius:24px;padding:16px;margin-bottom:14px}
.detail .m4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;text-align:center}
.detail .m4 div{background:#fff;border-radius:14px;padding:8px 4px}
.detail .m4 b{display:block;font-family:var(--display);font-size:20px}
.detail .m4 span{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--brand)}
.stepper input{width:80px;text-align:center;background:#fff}
.mealtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.mealtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.mealtabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.planrow{display:grid;grid-template-columns:40px 1fr 1.25fr;gap:8px;align-items:center;padding:5px 0}
.planrow input:disabled{opacity:.45}
.foc{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;line-height:1.2}
.focuscard{background:var(--brand-soft);border-radius:22px;padding:14px 16px;margin-bottom:12px}
details summary{cursor:pointer;font-weight:600;color:var(--brand)}
details ol{padding-left:20px;margin:10px 0 0;font-size:14px}
details li{margin-bottom:6px}
textarea{resize:vertical}
.cico{width:36px;height:36px;border-radius:12px;background:var(--water-soft);color:var(--water);display:grid;place-items:center;flex:none}
.cico .ico{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ================= state ================= */
const LS_KEY = "repfuel-state-v1";
const blank = () => ({profile:null, food:{}, workouts:[], cardio:[], rest:{}, dayPlan:{}, social:{joined:false, name:"", fives:{}}, weights:{}, sleep:{}, water:{}, watch:{}, sup:[], supTaken:{}, products:{}, updatedAt:0});
let state = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
migrate();
let viewDate = dkey(new Date());
let dbRef = null, saveTimer = null, sampleFn = null, canImages = false, chosenEx = null;
let pendingBarcode = null, addMeal = null, suggs = null, suggBusy = false, trainMode = "lift", weekOffset = 0, monthOffset = 0;
let editing = false, draft = null, step = 0, supQuery = "", supLookup = null, supBusy = false;
let myId = null, playersCol = null, players = null, playersErr = false, canWrite = null, lastPub = "", userCap = null;
let foodQ = "", foodSel = null, aiFoods = null, aiBusy = false, quickOpen = false, planEdit = false, planDraft = null;

const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function defaultSchedule(lift, cardio){
  const s = Array(7).fill("rest");
  const liftOrder = [0,2,4,1,3,5,6], cardOrder = [1,3,5,6,0,2,4];
  liftOrder.slice(0, lift).forEach(i => s[i] = "lift");
  cardOrder.slice(0, cardio).forEach(i => s[i] = s[i] === "lift" ? "both" : "cardio");
  return s;
}
const SPLITS = ["Chest & tris","Back & bis","Shoulders & arms","Arms","Legs","Push","Pull","Upper body","Lower body","Full body","Glutes & hamstrings","Chest & back","Core & cardio"];
function defaultFocus(sch){
  const days = sch.map((t,i)=>(t==="lift"||t==="both")?i:-1).filter(i=>i>=0);
  const plans = {1:["Full body"],2:["Upper body","Lower body"],3:["Push","Pull","Legs"],4:["Upper body","Lower body","Upper body","Lower body"],5:["Chest & tris","Back & bis","Legs","Shoulders & arms","Full body"],6:["Push","Pull","Legs","Push","Pull","Legs"],7:["Push","Pull","Legs","Upper body","Lower body","Full body","Core & cardio"]}[days.length] || [];
  const f = Array(7).fill(""); days.forEach((d,j)=>f[d]=plans[j]||""); return f;
}
function migrate(){
  const p = state.profile;
  if (p){
    if (!p.wUnit){ p.wUnit = p.units === "imperial" ? "lb" : "kg"; p.hUnit = p.units === "imperial" ? "ft" : "cm"; delete p.units; }
    p.pace ||= "standard"; p.exp ||= "beginner"; p.diet ||= "none";
    if (p.liftDays == null) p.liftDays = 4; if (p.cardioDays == null) p.cardioDays = 1;
    p.schedule ||= defaultSchedule(p.liftDays, p.cardioDays);
    p.focus ||= defaultFocus(p.schedule);
  }
  state.workouts.forEach(w => { if (!w.ts) w.ts = parseKey(w.date).getTime() + 18*3.6e6; w.ex.forEach(e => { if (!e.group) e.group = guessGroup(e.name); }); });
  Object.values(state.food).forEach(list => list.forEach(e => { if (!e.m) e.m = "s"; }));
  state.social ||= {joined:false, name:"", fives:{}}; state.social.fives ||= {};
}
function save(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  if (!dbRef && leagueOn && state.social.joined){ clearTimeout(saveTimer); saveTimer = setTimeout(publishPlayer, 1500); }
  if (dbRef){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await dbRef.set({json: JSON.stringify(state), updatedAt: state.updatedAt}); setSync("Synced"); await publishPlayer(); }
      catch(e){ setSync("Saved on this device"); }
    }, 700);
  }
}
function setSync(t){ document.getElementById("sync").textContent = t; }
/* ===== web services (Netlify functions) ===== */
async function blobToB64(blob){ return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
function parseJSONText(t){ t = String(t||"").replace(/```json|```/g, "").trim(); const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a < 0 || b < a) throw {code:"invalid_json"}; return JSON.parse(t.slice(a, b+1)); }
const AI = {
  async json(prompt, opts={}){
    const images = [];
    for (const im of (opts.images||[])) images.push({type: im.type || "image/jpeg", data: await blobToB64(im)});
    let r;
    try { r = await fetch("/api/ai", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({prompt, images})}); }
    catch(e){ toast("You’re offline. Try again when connected."); throw {code:"offline"}; }
    if (r.status === 429){ const j = await r.json().catch(()=>({})); toast(j.error === "site_limit" ? "BRUDEL’s AI is busy today. Try again tomorrow." : "You’ve used today’s AI requests. They reset tomorrow."); throw {code:"rate_limited"}; }
    if (!r.ok) throw {code:"ai_error"};
    const j = await r.json(); return parseJSONText(j.text);
  },
  async limits(){ return {images:true}; }
};
let leagueOn = false, leagueTimer = null;
function rid(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>"abcdefghijklmnopqrstuvwxyz0123456789"[x%36]).join(""); }
function leagueCode(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", a = new Uint8Array(6); crypto.getRandomValues(a); return [...a].map(x=>A[x%A.length]).join(""); }
async function loadPlayers(){
  if (!leagueOn || !state.social.league) return;
  try { const r = await fetch("/api/league?code=" + encodeURIComponent(state.social.league)); if (!r.ok) throw 0; players = (await r.json()).players || []; playersErr = false; }
  catch(e){ playersErr = true; }
  if (location.hash === "#friends") route();
}
(async function initWeb(){
  setSync("Saved on this device");
  state.social.pid ||= rid(20); state.social.secret ||= rid(32);
  myId = state.social.pid; canWrite = true;
  try { const r = await fetch("/api/ai"); const j = await r.json(); if (j.ok){ sampleFn = AI; canImages = true; route(); } } catch(e){}
  try { const r = await fetch("/api/league?ping=1"); if (r.ok && (await r.json()).ok){ leagueOn = true;
    playersCol = { doc: id => ({
      set: async data => { const r = await fetch("/api/league", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code: state.social.league, id: state.social.pid, secret: state.social.secret, data})}); if (!r.ok) throw new Error(String(r.status)); loadPlayers(); },
      delete: async () => { await fetch("/api/league", {method:"DELETE", headers:{"Content-Type":"application/json"}, body: JSON.stringify({code: state.social.league, id: state.social.pid, secret: state.social.secret})}); }
    })};
    if (state.social.joined) publishPlayer(); loadPlayers(); route(); } } catch(e){}
})();
(async function connect(){
  if (!window.claude || !window.claude.use) { setSync("Saved on this device"); return; }
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (db && user){
      const uid = await user.id();
      if (uid){
        myId = uid; userCap = user; dbRef = db.collection("data/users/" + uid).doc("state");
        try { canWrite = await user.can("data.write"); } catch(e){}
        playersCol = db.collection("players");
        const pTimer = setTimeout(()=>{ if (!players){ playersErr = true; if (location.hash==='#friends') route(); } }, 10000);
        playersCol.onSnapshot(snap => { clearTimeout(pTimer); playersErr = false; players = snap.docs.map(d => ({id:d.id, ...d.data()})); if (location.hash === '#friends') route(); }, () => { clearTimeout(pTimer); playersErr = true; if (location.hash==='#friends') route(); });
        const snap = await dbRef.get();
        if (snap.exists){
          const remote = JSON.parse(snap.data().json || "{}");
          if ((remote.updatedAt || 0) > (state.updatedAt || 0)){
            state = Object.assign(blank(), remote); migrate();
            try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
            route();
          } else if (state.profile) save();
        } else if (state.profile) save();
        setSync("Synced"); publishPlayer();
      }
    } else setSync("Saved on this device");
  } catch(e){ setSync("Saved on this device"); }
  try {
    sampleFn = await claude.use("sample");
    if (sampleFn){ try { canImages = !!(await sampleFn.limits()).images; } catch(e){} route(); }
  } catch(e){}
})();

/* ================= helpers ================= */
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function shift(k, n){ const d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }

function cardioKcal(c){
  const kg = latestWeightKg(), T = CARDIO[c.type] || CARDIO.other;
  let met = T.m[c.int ?? 1];
  if (c.type === "run" && c.km && c.min){ met = Math.max(6, (c.km/(c.min/60)) * 1.0); }
  if (c.type === "walk" && c.km && c.min){ const s = c.km/(c.min/60); met = s < 4 ? 3 : s < 5.6 ? 3.8 : 5; }
  return Math.max(0, (met - 1) * kg * c.min/60);
}
function supTotals(k){
  const t = {kcal:0, protein_g:0, carbs_g:0, fat_g:0, caffeine_mg:0, creatine_g:0};
  (state.supTaken[k]||[]).forEach(id => { const s = state.sup.find(x=>x.id===id); if (s && s.per) Object.keys(t).forEach(f => t[f] += +(s.per[f]||0)); });

}
function targets(k){
  const p = state.profile, w = latestWeightKg();
  const sexAdj = p.sex === "m" ? 5 : p.sex === "f" ? -161 : -78;
  const bmr = 10*w + 6.25*p.heightCm - 5*p.age + sexAdj;
  // NEAT factor + lifting allowance (≈ 0.025 per weekly lifting day)
  const factor = +p.activity + 0.025*p.liftDays;
  const tdee = bmr * factor;
  const minor = p.age < 18;
  const paceMul = {gentle:.5, standard:1, fast:1.25}[p.pace];
  let adj = 0;
  if (p.goal === "lose") adj = -0.20*paceMul;
  if (p.goal === "gain") adj = ({beginner:.10, intermediate:.075, advanced:.05}[p.exp]) * (p.pace==="fast"?1.5:paceMul);
  if (minor) adj = Math.max(0, adj);
  let kcal = tdee*(1+adj);
  const floor = p.sex === "f" ? 1200 : 1500, floored = kcal < floor;
  if (floored) kcal = floor;
  const pPerKg = {lose:2.2, gain:1.8, recomp:2.2, maintain:1.6, endurance:1.6}[p.goal];
  const protein = pPerKg*w, fat = Math.max(0.25*kcal/9, 0.6*w);
  const carbs = Math.max(0, (kcal - protein*4 - fat*9)/4);
  const sleep = p.age < 13 ? [9,12] : p.age < 18 ? [8,10] : p.age < 65 ? [7,9] : [7,8];
  const base = {lose:[-1,-0.5], gain:[0.25,0.5], recomp:[-0.25,0.25], maintain:[-0.25,0.25], endurance:[-0.25,0.25]}[p.goal];
  const r2 = x => Math.round(x*100)/100; const rate = p.goal==="lose" ? [r2(-1*paceMul), r2(-0.5*paceMul)] : p.goal==="gain" ? [r2(0.25*paceMul), r2(0.5*paceMul)] : base;
  const steps = p.age < 60 ? [8000,10000] : [6000,8000];
  // day-specific cardio add-back
  let cardioK = 0, cardioMin = 0;
  if (k) state.cardio.filter(c=>c.date===k).forEach(c => { cardioK += cardioKcal(c); cardioMin += c.min; });
  cardioK = r0(cardioK);

}

function bestBefore(name, date){ let best = 0; state.workouts.forEach(w => { if (w.date < date) w.ex.forEach(e => { if (e.name.toLowerCase() === name.toLowerCase()) e.sets.forEach(s => best = Math.max(best, e1rm(s.w, s.r))); }); }); return best; }

const EXLIB = {chest:["Bench press","Incline dumbbell press","Cable fly"], tris:["Tricep pushdown","Overhead tricep extension","Dips"], back:["Lat pulldown","Barbell row","Seated cable row","Pull-ups"], bis:["Barbell curl","Hammer curl","Incline dumbbell curl"], shoulders:["Overhead press","Lateral raise","Rear delt fly"], legs:["Squat","Romanian deadlift","Leg press","Leg curl","Calf raise"], glutes:["Hip thrust","Bulgarian split squat","Romanian deadlift"], core:["Plank","Cable crunch","Hanging leg raise"]};
function exercisesFor(f){
  f = (f||"").toLowerCase(); if (!f) return [];
  if (/full/.test(f)) return ["Squat","Bench press","Barbell row","Overhead press","Romanian deadlift"];
  const keys = [];
  if (/chest|push|upper/.test(f)) keys.push("chest");
  if (/back|pull|upper/.test(f)) keys.push("back");
  if (/shoulder|delt|push|upper/.test(f)) keys.push("shoulders");
  if (/tri|arm|push/.test(f)) keys.push("tris");
  if (/\bbi|bies|bis\b|bicep|arm|pull/.test(f)) keys.push("bis");
  if (/leg|lower|quad/.test(f)) keys.push("legs");
  if (/glute|ham|lower|booty/.test(f)) keys.push("glutes");
  if (/core|ab/.test(f)) keys.push("core");
  const per = keys.length > 2 ? 2 : 3, out = [];
  keys.forEach(k => EXLIB[k].slice(0,per).forEach(e => { if (!out.includes(e)) out.push(e); }));
  return out;
}

function weekStats(mon){
  const sch = state.profile.schedule; let lift=0, card=0, rest=0, pl=0, pc=0, min=0, km=0;
  for (let i=0;i<7;i++){
    const k = shift(mon,i), a = actualType(k), p = planOf(k).type;
    if (p==="lift"||p==="both") pl++; if (p==="cardio"||p==="both") pc++;
    if (a==="lift"||a==="both") lift++; if (a==="cardio"||a==="both") card++; if (a==="rest") rest++;
    state.cardio.filter(c=>c.date===k).forEach(c=>{ min += c.min; km += c.km||0; });
  }
  return {lift, card, rest, pl, pc, min, km};
}
function streak(){
  let n = 0, mon = mondayOf(todayKey());
  const cur = weekStats(mon); if (cur.lift >= cur.pl && cur.card >= cur.pc && (cur.pl+cur.pc)) n++;
  for (let w=1; w<104; w++){ const s = weekStats(shift(mon, -7*w)); if (s.lift >= s.pl && s.card >= s.pc && (s.pl+s.pc)) n++; else break; }
  return n;
}

/* ================= Recover ================= */
function muscleStatus(){
  const now = Date.now(), out = [];
  GROUPS.forEach(g => {
    let last = null, sets = 0;
    state.workouts.forEach(w => { const s = w.ex.filter(e => e.group === g).reduce((a,e)=>a+e.sets.length,0); if (s && w.ts <= now && (!last || w.ts > last)){ last = w.ts; sets = s; } });
    if (["Quads","Hamstrings","Calves"].includes(g)){
      state.cardio.forEach(c => { if ((c.type==="run"||c.type==="hiit") && c.int===2){ const ts = parseKey(c.date).getTime()+18*3.6e6; if (ts<=now && (!last || ts > last)){ last = ts; sets = 4; } } });
    }
    if (!last){ out.push({g, pct:100, left:0, never:true}); return; }
    const small = SMALL.includes(g), need = (small ? 36 : 48) + (sets >= (small ? 6 : 8) ? (small ? 12 : 24) : 0);
    const hrs = (now - last)/3.6e6;
    out.push({g, pct:Math.min(100, hrs/need*100), left:Math.max(0, need-hrs)});
  });
  return out;
}
function baseline(field, k){ const keys = Object.keys(state.watch).filter(d => d < k && state.watch[d][field] != null).sort().slice(-7); if (keys.length < 3) return null; return keys.reduce((a,d)=>a+state.watch[d][field],0)/keys.length; }
function readiness(k){
  const T = targets(k), m = state.watch[k] || {}, parts = [], sl = state.sleep[k];
  if (sl != null) parts.push({n:"Sleep", w:40, s:Math.max(0, Math.min(1, (sl-4)/(T.sleep[0]-4))), t:`${sl} h vs ${T.sleep[0]}+ h`});
  const hb = baseline("hrv", k); if (m.hrv != null && hb){ const r = m.hrv/hb; parts.push({n:"HRV", w:30, s:Math.max(0, Math.min(1, (r-0.8)/0.2)), t:`${m.hrv} vs ${r0(hb)} ms`}); }
  const rb = baseline("rhr", k); if (m.rhr != null && rb){ const d = m.rhr - rb; parts.push({n:"Resting HR", w:20, s:Math.max(0, Math.min(1, 1 - d/6)), t:`${m.rhr} vs ${r0(rb)} bpm`}); }
  const ms = muscleStatus().filter(x=>!x.never); if (ms.length){ const avg = ms.reduce((a,x)=>a+x.pct,0)/ms.length/100; parts.push({n:"Muscles", w:10, s:avg, t:`${r0(avg*100)}% recovered`}); }
  if (!parts.length) return null;
  const W = parts.reduce((a,p)=>a+p.w,0);
  return {score: r0(parts.reduce((a,p)=>a+p.w*p.s,0)/W*100), parts};
}

  if (chosenEx) state.workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w => { let best = 0; w.ex.forEach(e => { if (e.name === chosenEx) e.sets.forEach(s => best = Math.max(best, e1rm(s.w,s.r))); }); if (best) spts.push({x:parseKey(w.date).getTime(), y:fromKg(best)}); });
  names.forEach(n => { let b = 0; state.workouts.forEach(w=>w.ex.forEach(e=>{ if(e.name===n) e.sets.forEach(s=>b=Math.max(b,e1rm(s.w,s.r))); })); prs.push([n,b]); });
  prs.sort((a,b)=>b[1]-a[1]);
  const vol = {}, wkAgo = shift(todayKey(), -6);
  state.workouts.filter(w=>w.date>=wkAgo).forEach(w=>w.ex.forEach(e=>vol[e.group]=(vol[e.group]||0)+e.sets.length));
  const runs = state.cardio.filter(c=>c.type==="run" && c.km).sort((a,b)=>a.date.localeCompare(b.date));
  const rpts = runs.map(c=>({x:parseKey(c.date).getTime(), y:c.min/fromKm(c.km)}));
  return `<h2>Bodyweight</h2>
  <section class="card" style="margin-top:12px">

    <div class="stat"><div><b>${lastW!=null ? r1(fromKg(lastW)) : "—"}</b><span>Latest ${wUnit()}</span></div><div><b>${changeTxt}</b><span>${wUnit()} / week</span></div><div><b>${rateTxt}</b><span>Body weight / week</span></div></div>
    ${chart(pts, {avg:true, label:"Bodyweight", empty:"Weigh in a few mornings to see your trend."})}
    <p class="small muted" style="margin-top:8px">Dots are weigh-ins; the line is your 7-day average. Target pace: ${T.rate.map(x=>(x>0?"+":"")+x).join(" to ")}% per week.${p.targetKg ? ` Goal weight: ${r1(fromKg(p.targetKg))} ${wUnit()}.` : ""}</p>
    ${eta ? `<p class="note" style="margin-bottom:0">${eta}</p>` : ""}
  </section>
  <h3>Running pace</h3>
  <section class="card">${chart(rpts, {label:"Run pace", color:"var(--cardio)", empty:"Log two runs with distance to see your pace trend."})}${rpts.length>=2?`<p class="small muted" style="margin-top:8px">Minutes per ${dUnit()} (lower is faster). Best: ${paceFmt(Math.min(...rpts.map(p=>p.y)))} /${dUnit()}.</p>`:""}</section>
  <h3>Weekly sets per muscle</h3>
  <section class="card">${Object.keys(vol).length ? GROUPS.filter(g=>vol[g]).map(g=>`<div class="musc"><span>${g}</span><div class="track" style="margin:0;height:10px"><div class="fill" style="width:${Math.min(100,vol[g]/20*100)}%;background:${vol[g]>=10?'var(--brand)':'var(--c)'}"></div></div><span class="v">${vol[g]} sets</span></div>`).join("") + `<p class="small muted" style="margin:10px 0 0">Last 7 days. 10–20 hard sets per muscle per week is the growth range.</p>` : `<p class="empty">Log workouts to see weekly volume.</p>`}</section>
  <h3>Strength</h3>
  <section class="card">${names.length ? `<label for="exSel">Exercise</label><select id="exSel">${names.map(n=>`<option ${n===chosenEx?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <div style="margin-top:12px">${chart(spts, {label:"Estimated 1RM", empty:"Log this lift in two sessions to see a trend."})}</div>
    <h4 style="margin:16px 0 4px">Personal records</h4><table><thead><tr><th>Exercise</th><th>Best est. 1RM</th></tr></thead><tbody>${prs.map(([n,b])=>`<tr><td>${esc(n)}</td><td class="n">${r1(fromKg(b))} ${wUnit()}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Log workouts in Train to track your lifts.</p>`}</section>`;
}

/* ================= Onboarding / Plan ================= */
function newDraft(){ return Object.assign({goal:"", pace:"standard", sex:"m", age:"", heightCm:"", weightKg:"", targetKg:"", activity:1.375, exp:"beginner", liftDays:4, cardioDays:1, diet:"none", wUnit:"lb", hUnit:"ft"}, state.profile ? JSON.parse(JSON.stringify(state.profile)) : {}); }
function optBtns(field, map, two){
  return `<div class="opts ${two?'two':''}">${Object.entries(map).map(([k,v])=>`<button class="opt" data-act="pick" data-f="${field}" data-v="${k}" aria-pressed="${String(draft[field])===k}"><b>${v.e?ic(v.e)+" ":""}${v.t||v}</b>${v.d?`<span>${v.d}</span>`:""}</button>`).join("")}</div>`;
}
const STEPS = ["goal","body","target","training","food"];
function vSetup(){ if (!draft) { draft = newDraft(); step = 0; } return wizard(); }
function wizard(){
  const d = draft, s = STEPS[step];
  const ft = d.heightCm ? Math.floor(d.heightCm/2.54/12) : "", inch = d.heightCm ? r0(d.heightCm/2.54 - ft*12) : "";

  let body = "";
  if (s === "goal") body = `<h2>What’s your main goal?</h2><p class="muted" style="margin:8px 0 16px">Everything in BRUDEL adjusts to this: calories, macros, training advice and meal ideas.</p>${optBtns("goal", GOALS)}`;
  if (s === "body") body = `<h2>About you</h2><p class="muted" style="margin:8px 0 16px">Used to estimate how much energy your body burns.</p>
    <div class="grid2">
      <div class="field"><label for="swu">Weight in</label><select id="swu" data-draft="wUnit"><option value="lb" ${d.wUnit==="lb"?"selected":""}>Pounds (lb)</option><option value="kg" ${d.wUnit==="kg"?"selected":""}>Kilograms (kg)</option></select></div>
      <div class="field"><label for="shu">Height in</label><select id="shu" data-draft="hUnit"><option value="ft" ${d.hUnit==="ft"?"selected":""}>Feet + inches</option><option value="cm" ${d.hUnit==="cm"?"selected":""}>Centimetres</option></select></div>
      <div class="field"><label for="ss">Sex</label><select id="ss"><option value="m" ${d.sex==="m"?"selected":""}>Male</option><option value="f" ${d.sex==="f"?"selected":""}>Female</option><option value="x" ${d.sex==="x"?"selected":""}>Prefer not to say</option></select></div>
      <div class="field"><label for="sa">Age</label><input id="sa" inputmode="numeric" value="${d.age}"></div>
      <div class="field"><label for="sw">Weight (${d.wUnit})</label><input id="sw" inputmode="decimal" value="${wv(d.weightKg)}"></div>
      ${d.hUnit==="ft" ? `<div class="field"><label>Height</label><div class="row"><input id="sft" inputmode="numeric" placeholder="ft" aria-label="Feet" value="${ft}"><input id="sin" inputmode="numeric" placeholder="in" aria-label="Inches" value="${inch}"></div></div>` : `<div class="field"><label for="sh">Height (cm)</label><input id="sh" inputmode="decimal" value="${d.heightCm ? r0(d.heightCm) : ""}"></div>`}
    </div>`;
  if (s === "target") body = `<h2>${d.goal==="lose"?"Your target":d.goal==="gain"?"How fast to gain":"Fine-tune"}</h2><p class="muted" style="margin:8px 0 16px">${d.goal==="lose"||d.goal==="gain" ? "Pick a pace. Slower keeps more muscle (or less fat) and is easier to stick with." : "A goal weight is optional; we’ll show your projected date on Progress."}</p>
    <div class="field"><label for="stw">Goal weight (${d.wUnit}, optional)</label><input id="stw" inputmode="decimal" value="${wv(d.targetKg)}"></div>
    ${d.goal==="lose"||d.goal==="gain" ? `<label>Pace</label>${optBtns("pace", PACES)}` : ""}
    <div class="field" style="margin-top:14px"><label for="sact">Daily activity outside workouts</label><select id="sact">${ACT.map(([v,t,dd])=>`<option value="${v}" ${+d.activity===v?"selected":""}>${t}: ${dd}</option>`).join("")}</select></div>`;
  if (s === "training") body = `<h2>Your training</h2><p class="muted" style="margin:8px 0 16px">This sets up your weekly schedule and recovery advice.</p>
    <label>Lifting experience</label>${optBtns("exp", EXP)}
    <div class="grid2" style="margin-top:14px">
      <div class="field"><label for="sld">Gym days per week</label><select id="sld">${[0,1,2,3,4,5,6].map(n=>`<option ${+d.liftDays===n?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label for="scd">Runs / cardio per week</label><select id="scd">${[0,1,2,3,4,5,6,7].map(n=>`<option ${+d.cardioDays===n?"selected":""}>${n}</option>`).join("")}</select></div>
    </div>`;
  if (s === "food") body = `<h2>How do you eat?</h2><p class="muted" style="margin:8px 0 16px">Meal suggestions will stick to this.</p>${optBtns("diet", DIETS, true)}`;
  const last = step === STEPS.length-1;
  return `<div class="steps">${STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join("")}</div>
  ${body}
  <p class="small" id="serr" role="alert" style="color:var(--warn);margin-top:10px"></p>
  <div class="row" style="margin-top:8px">${step>0 ? `<button class="btn ghost" data-act="back">Back</button>` : (state.profile ? `<button class="btn ghost" data-act="cancelEdit">Cancel</button>` : "")}<button class="btn" style="flex:1" data-act="next">${last ? (state.profile ? "Save plan" : "Build my plan") : "Continue"}</button></div>`;
}
function readStep(){
  const d = draft, s = STEPS[step], err = document.getElementById("serr");
  if (s === "goal" && !d.goal){ err.textContent = "Pick a goal to continue."; return false; }
  if (s === "body"){
    d.sex = document.getElementById("ss").value;
    const a = num("sa"), w = num("sw");
    d.age = a ?? ""; d.weightKg = w!=null ? (d.wUnit==="lb" ? w/2.20462 : w) : "";
    if (d.hUnit === "ft"){ const f = num("sft")||0, i = num("sin")||0; d.heightCm = (f||i) ? (f*12+i)*2.54 : ""; } else d.heightCm = num("sh") ?? "";
    if (!(d.age>=10 && d.age<=100)){ err.textContent = "Enter an age between 10 and 100."; return false; }
    if (!(d.weightKg>=30 && d.weightKg<=300)){ err.textContent = "Enter a realistic weight."; return false; }
    if (!(d.heightCm>=100 && d.heightCm<=250)){ err.textContent = "Enter a realistic height."; return false; }
  }
  if (s === "target"){
    const t = num("stw"); d.targetKg = t!=null ? (d.wUnit==="lb" ? t/2.20462 : t) : "";
    d.activity = parseFloat(document.getElementById("sact").value);
    if (d.targetKg && d.goal==="lose" && d.targetKg >= d.weightKg){ err.textContent = "For fat loss, the goal weight should be below your current weight."; return false; }
    if (d.targetKg && d.goal==="gain" && d.targetKg <= d.weightKg){ err.textContent = "For muscle gain, the goal weight should be above your current weight."; return false; }
  }
  if (s === "training"){ d.liftDays = +document.getElementById("sld").value; d.cardioDays = +document.getElementById("scd").value; }
  return true;
}
function finishSetup(){
  const first = !state.profile, d = draft;
  const old = state.profile;
  const schedChanged = !old || old.liftDays !== d.liftDays || old.cardioDays !== d.cardioDays;
  if (schedChanged){ d.schedule = defaultSchedule(d.liftDays, d.cardioDays); d.focus = defaultFocus(d.schedule); }
  const changedWeight = !old || Math.abs(old.weightKg - d.weightKg) > 0.05;
  state.profile = d;
  if (changedWeight) state.weights[todayKey()] = d.weightKg;
  editing = false; draft = null; step = 0; save();
  if (first) location.hash = "#plan"; else route(true);
  toast(first ? "Your plan is ready" : "Plan updated");
}

    <p><b>Your goal:</b> ${T.kcal} kcal, which is ${adjTxt}${p.goal==="lose"||p.goal==="gain" ? ` at a ${PACES[p.pace].t.toLowerCase()} pace` : ""}.${T.floored ? " Raised to a minimum floor so you can meet nutrient needs." : ""}</p>

/* ================= Science ================= */
function vScience(){ return `<div class="sci">
  <a href="#plan" class="small muted" style="text-decoration:none">‹ Back to plan</a>
  <h2 style="margin-top:8px">The science</h2>
  <p class="muted" style="margin-top:6px">What every number in BRUDEL is based on.</p>
  <p class="small muted">Packaged food data from Open Food Facts contributors (openfoodfacts.org), ODbL license.</p>
  <h3>Calories</h3><p>Resting burn comes from the Mifflin-St Jeor equation, the most accurate common equation for healthy adults (within about 10% for most people). Multiplying by your activity gives maintenance. Your 7-day weight trend is the real measurement.</p><p class="ref">Mifflin et al., 1990, Am J Clin Nutr · Frankenfield et al., 2005, J Am Diet Assoc</p>
  <h3>Fat loss pace</h3><p>Athletes losing about 0.7% of body weight a week gained lean mass and strength; those losing 1.4% a week didn’t. Slower cuts protect muscle.</p><p class="ref">Garthe et al., 2011, Int J Sport Nutr Exerc Metab · Helms et al., 2014, J Int Soc Sports Nutr</p>
  <h3>Muscle gain surplus</h3><p>Muscle grows slowly, so a big surplus mostly adds fat. Beginners can use a larger surplus than advanced lifters because they gain muscle faster.</p><p class="ref">Iraki et al., 2019, Sports</p>
  <h3>Protein</h3><p>Across 49 trials, extra protein boosted gains from lifting, leveling off around 1.6 g/kg a day (up to about 2.2 g/kg). Needs rise in a deficit, so fat-loss and recomp plans use 2.2 g/kg. Spread it over 3–4 meals.</p><p class="ref">Morton et al., 2018, Br J Sports Med · Schoenfeld & Aragon, 2018, J Int Soc Sports Nutr</p>
  <h3>Fat, carbs and fiber</h3><p>Fat sits at about 25% of calories (the recommended range is 20–35%). Carbs fill the rest and rise on cardio days, since endurance athletes need more carbohydrate as training volume goes up. Fiber is 14 g per 1,000 kcal.</p><p class="ref">Institute of Medicine, 2005 · Thomas et al., 2016, ACSM/AND/DC joint position · Dietary Guidelines for Americans 2020–2025</p>
  <h3>Cardio calories</h3><p>Calories burned are estimated with MET values from the Compendium of Physical Activities (for runs with distance, from your speed), minus your resting burn so it isn’t counted twice. Wearables and machines often overestimate, so these are kept conservative.</p><p class="ref">Ainsworth et al., 2011, Med Sci Sports Exerc</p>
  <h3>Running</h3><p>Most well-trained endurance athletes do about 80% of training at low intensity and 20% hard. Increasing weekly load gradually lowers injury risk, and strength training improves running economy.</p><p class="ref">Seiler, 2010, Int J Sports Physiol Perform · Blagrove et al., 2018, Sports Med</p>
  <h3>Water</h3><p>Losing more than about 2% of body weight as sweat hurts performance. Baseline is roughly 35 ml per kg, and exercise adds about 0.4–0.8 L per hour. Pale yellow urine is a simple check.</p><p class="ref">Sawka et al., 2007, ACSM position stand, Med Sci Sports Exerc · EFSA, 2010</p>
  <h3>Training</h3><p>More weekly sets lead to more growth, with 10+ hard sets per muscle per week beating lower volumes. Training a muscle twice a week beats once. Light and heavy loads build similar muscle when sets go close to failure.</p><p class="ref">Schoenfeld et al., 2017, J Sports Sci · Schoenfeld et al., 2016, Sports Med</p>
  <h3>Recovery</h3><p>After a hard session, muscle protein synthesis is mostly back to baseline by 36–48 hours, and strength can take 48–72 hours to return after high-volume work.</p><p class="ref">MacDougall et al., 1995, Can J Appl Physiol</p>
  <h3>Readiness and HRV</h3><p>HRV compared with your own baseline reflects recovery. Athletes who trained hard only when HRV was normal or high improved more than those on a fixed plan. The score blends sleep (40%), HRV (30%), resting HR (20%) and muscle recovery (10%). It’s a guide, not a diagnosis.</p><p class="ref">Kiviniemi et al., 2007, Eur J Appl Physiol · Plews et al., 2013, Sports Med</p>
  <h3>Sleep</h3><p>Adults need 7–9 hours, teens 8–10. On the same diet, people sleeping 5.5 h lost about 55% less fat than at 8.5 h. One night without sleep cut muscle protein synthesis by about 18%.</p><p class="ref">Watson et al., 2015, Sleep · Nedeltcheva et al., 2010, Ann Intern Med · Lamon et al., 2021, Physiol Rep</p>
  <h3>Steps</h3><p>Mortality risk falls as daily steps rise, leveling off around 8,000–10,000 for adults under 60 and 6,000–8,000 over 60.</p><p class="ref">Paluch et al., 2022, Lancet Public Health</p>
  <h3>Supplements</h3><p><b>Creatine</b> (3–5 g a day) is the best-supported supplement for strength and muscle. <b>Caffeine</b> boosts performance at 3–6 mg/kg; healthy adults should stay under about 400 mg a day, and a dose 6 hours before bed cut sleep by over an hour. <b>Beta-alanine</b> helps 1–4 minute efforts. Most others help mainly if you’re deficient.</p><p class="ref">Kreider et al., 2017 · Guest et al., 2021 · Trexler et al., 2015 · Drake et al., 2013, J Clin Sleep Med · US FDA</p>

async function downscale(file, max=1280){
  const bmp = await createImageBitmap(file), s = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = r0(bmp.width*s); c.height = r0(bmp.height*s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}
async function readBarcode(file){

}

    try { const r = await sampleFn.json(`What is in the supplement product "${supQuery}"? Give typical amounts per one serving based on the current formula as best you know it. Use 0 for anything not present. If you don't recognise the exact product, give your best estimate for that product type and set confidence to "low". Respond with only JSON: ${SUP_SCHEMA}`, {modelTier:"default"});
      supLookup = normLookup(r); }
    catch(e){ toast("Couldn’t look that up. Try the label photo or add it manually."); }
    supBusy = false; refreshSup(); return;
  }
  if (a === "supPhoto"){ document.getElementById("supFile").click(); return; }
  if (a === "addLookup"){ const L = supLookup; state.sup.push({id:"c"+Date.now(), name:L.name, dose:L.dose, per:L.per, note:L.notes, custom:true}); supLookup = null; supQuery = ""; save(); route(); toast(L.name + " added"); return; }
  if (a === "clearLookup"){ supLookup = null; refreshSup(); return; }
  if (a === "delSup"){ state.sup.splice(+b.dataset.i,1); save(); route(); return; }
  if (a === "edit"){ editing = true; draft = newDraft(); step = 0; route(true); return; }
  if (a === "cancelEdit"){ editing = false; draft = null; route(true); return; }
  if (a === "pick"){ const f = b.dataset.f; draft[f] = b.dataset.v; b.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed", x===b)); return; }
  if (a === "next"){ if (!readStep()) return; if (step === STEPS.length-1) finishSetup(); else { step++; route(true); } return; }
  if (a === "back"){ readStepSoft(); step--; route(true); return; }
  if (a === "backup"){ const blob = new Blob([JSON.stringify(state)], {type:"application/json"}); const url = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = url; l.download = "brudel-backup-" + todayKey() + ".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000); return; }
  if (a === "restore"){ const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json"; inp.onchange = async () => { try { const data = JSON.parse(await inp.files[0].text()); if (!data || typeof data !== "object" || !("food" in data)) throw 0; if (!confirm("Replace everything on this phone with the backup?")) return; state = Object.assign(blank(), data); migrate(); save(); route(true); toast("Backup restored"); } catch(e){ toast("That file isn’t a BRUDEL backup"); } }; inp.click(); return; }
  if (a === "reset"){ if (!confirm("Erase all workouts, food logs and settings? This can’t be undone.")) return; state = blank(); save(); draft = null; step = 0; location.hash = "#today"; route(); return; }
});
function readStepSoft(){ try { const e = document.getElementById("serr"); readStep(); if (e) e.textContent = ""; } catch(x){} }
function fallbackFor(m, diet){
  let list = FALLBACK.filter(x => x.meal === m || (m==="s" && x.meal==="s"));
  if (diet === "vegetarian") list = FALLBACK.filter(x=>x.veg); if (diet === "vegan") list = FALLBACK.filter(x=>x.vegan);
  if (list.length < 2) list = FALLBACK.filter(x => diet==="vegan" ? x.vegan : diet==="vegetarian" ? x.veg : true);
  return list.slice(0,3);
}
route();
</script>
